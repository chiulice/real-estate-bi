<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>台灣不動產與總經決策平台</title>
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 頂部極簡導覽列 */
    header {
      height: 48px;
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #f8fafc;
      border-bottom: 1px solid #334155;
      user-select: none;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-tag {
      font-size: 11px;
      background-color: #059669;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }

    /* 報表自適應滿版容器 */
    .dashboard-viewport {
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
      background: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span>🏛️</span>
      <span>不動產與總經決策平台</span>
    </div>
    <div class="status-tag">即時連線</div>
  </header>
  
  <div class="dashboard-viewport">
    <iframe 
      src="https://lookerstudio.google.com/embed/reporting/f17b63d4-c8c6-417e-9515-d438349161aa/page/p_2ole70ks8d" 
      frameborder="0" 
      style="border:0" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
